services:
  - type: web
    name: perform-football-preview
    runtime: node
    plan: free
    buildCommand: echo "Sin dependencias externas"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PERFORM_USER
        sync: false
      - key: PERFORM_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
